name: GT1 Full ROM Source Integration — Read-only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integration:
    name: Verify pinned kernel/QCA/Mali patches & ROM source consistency
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout public staging source
        uses: actions/checkout@v4

      - name: Validate manifests, patch hashes and build script syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n build/scripts/gt1_full_rom_build.sh
          bash build/scripts/gt1_full_rom_build.sh audit
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for file in sorted(Path('build/scripts').glob('gt1_*.py')):
              ast.parse(file.read_text())
              print('VALID PYTHON', file)
          PY

      - name: Fetch pinned upstream sources
        shell: bash
        run: |
          set -euo pipefail
          git clone -q --depth 50 -b lineage-19.1 https://github.com/LineageOS/android_kernel_amlogic_linux-4.9-pie.git kernel/amlogic/linux-4.9-pie
          git -C kernel/amlogic/linux-4.9-pie checkout -q ffb8d9d46aac1cde5ee5a1495aa86b62e484ac77

          git clone -q --depth 20 -b lineage-19.1 https://github.com/G12-Development/android_hardware_amlogic_kernel-modules_qca9377.git hardware/amlogic/kernel-modules/qca9377
          git -C hardware/amlogic/kernel-modules/qca9377 checkout -q 6d051c69d3b8acccc97abdbe0008c764a6901573

          git clone -q --depth 20 -b lineage-19.1 https://github.com/LineageOS/android_hardware_amlogic_kernel-modules_mali-driver.git hardware/amlogic/kernel-modules/mali-driver
          git -C hardware/amlogic/kernel-modules/mali-driver checkout -q e436241062014f098c12318033385bdc4e5a2fe8

      - name: Reproduce the exact 13 CI compatibility edits
        shell: bash
        run: |
          set -euo pipefail
          python3 -B build/scripts/gt1_export_rom_compat.py --verify \
            --kernel-source kernel/amlogic/linux-4.9-pie \
            --qca-source hardware/amlogic/kernel-modules/qca9377

      - name: Apply source-equivalent complete ROM patch series
        shell: bash
        run: |
          set -euo pipefail
          git -C kernel/amlogic/linux-4.9-pie -c user.name=GT1CI -c user.email=gt1-ci@localhost am \
            "$GITHUB_WORKSPACE"/build/ci-staging/patches/kernel/*.patch \
            "$GITHUB_WORKSPACE"/build/rom-compat-patches/kernel/*.patch
          git -C hardware/amlogic/kernel-modules/qca9377 -c user.name=GT1CI -c user.email=gt1-ci@localhost am \
            "$GITHUB_WORKSPACE"/build/ci-staging/patches/qca9377/*.patch \
            "$GITHUB_WORKSPACE"/build/rom-compat-patches/qca9377/*.patch
          git -C hardware/amlogic/kernel-modules/mali-driver -c user.name=GT1CI -c user.email=gt1-ci@localhost am \
            "$GITHUB_WORKSPACE"/build/ci-staging/patches/mali/*.patch

          for tree in kernel/amlogic/linux-4.9-pie hardware/amlogic/kernel-modules/qca9377 hardware/amlogic/kernel-modules/mali-driver; do
            test -z "$(git -C "$tree" status --porcelain)"
            git -C "$tree" log -1 --format='%h %s'
          done
          cmp device/amlogic/gt1v30/dts/gt1_v30_2g.dts kernel/amlogic/linux-4.9-pie/arch/arm64/boot/dts/amlogic/gt1_v30_2g.dts
          echo 'PASS: Kernel, Mali, QCA and GT1 DTS source integration'

      - name: Verify public repository contains no private partition or vendor dumps
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^device_dump/|^vendor/amlogic/gt1v30/proprietary/|\.img$|\.bin$|\.ko$)'; then
            echo "FATAL: public repository includes unexpected binary/backup path" >&2
            exit 1
          fi
          echo 'PASS: public staging has no private partition images or proprietary blobs'
