name: Beelink GT1 Kernel 4.9.113 & Modules (Ubuntu 22.04 Free Runner)

on:
  workflow_dispatch:

concurrency:
  group: beelink-gt1-kernel-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kernel-and-modules-arm64:
    name: Build Kernel 4.9.113 ARM64, Mali r28p0 & QCA9377 (Linaro GCC 7.5.0)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Step 1 - Runner & Disk Preflight
        run: |
          set -euo pipefail
          uname -a
          df -h
          free -h
          AVAIL_KB=$(df -Pk . | awk 'NR==2 {print $4}')
          if [ "$AVAIL_KB" -lt 6291456 ]; then
            echo "FATAL: Runner has less than 6 GiB free disk space ($AVAIL_KB KiB)!"
            exit 1
          fi

      - name: Step 2 - Checkout CI Staging Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git identity
        run: |
          git config --global user.name "GT1 CI Builder"
          git config --global user.email "gt1-ci@users.noreply.github.com"

      - name: Step 3 - Fetch Open-Source Upstream Trees & Apply Verified Patches
        run: |
          set -euo pipefail
          if [ ! -d "kernel/amlogic/linux-4.9-pie/.git" ]; then
            git clone --depth 50 -b lineage-19.1 https://github.com/LineageOS/android_kernel_amlogic_linux-4.9-pie.git kernel/amlogic/linux-4.9-pie
            git -C kernel/amlogic/linux-4.9-pie checkout ffb8d9d4
            git -C kernel/amlogic/linux-4.9-pie am "$GITHUB_WORKSPACE"/build/ci-staging/patches/kernel/*.patch
          fi
          if [ ! -d "hardware/amlogic/kernel-modules/mali-driver/.git" ]; then
            git clone --depth 20 -b lineage-19.1 https://github.com/LineageOS/android_hardware_amlogic_kernel-modules_mali-driver.git hardware/amlogic/kernel-modules/mali-driver
            git -C hardware/amlogic/kernel-modules/mali-driver checkout e436241
            git -C hardware/amlogic/kernel-modules/mali-driver am "$GITHUB_WORKSPACE"/build/ci-staging/patches/mali/*.patch
          fi
          if [ ! -d "hardware/amlogic/kernel-modules/qca9377/.git" ]; then
            git clone --depth 20 -b lineage-19.1 https://github.com/G12-Development/android_hardware_amlogic_kernel-modules_qca9377.git hardware/amlogic/kernel-modules/qca9377
            git -C hardware/amlogic/kernel-modules/qca9377 checkout 6d051c6
            git -C hardware/amlogic/kernel-modules/qca9377 am "$GITHUB_WORKSPACE"/build/ci-staging/patches/qca9377/*.patch
          fi

      - name: Fix GCC 9 compatibility in legacy kernel sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path

          root = Path("kernel/amlogic/linux-4.9-pie")

          p = root / "arch/arm64/kernel/ftrace.c"
          s = p.read_text()
          start = s.index("void prepare_ftrace_return(")
          end = s.index("\n#ifdef CONFIG_DYNAMIC_FTRACE", start)
          fn = s[start:end]

          changes = [
              ("\tint err;\n",
               "\tint err;\n\tint trace_depth;\n"),
              ("\terr = ftrace_push_return_trace(",
               "\ttrace_depth = trace.depth;\n"
               "\terr = ftrace_push_return_trace("),
              ("&trace.depth,", "&trace_depth,"),
          ]
          for old, new in changes:
              assert fn.count(old) == 1, old
              fn = fn.replace(old, new, 1)
          p.write_text(s[:start] + fn + s[end:])

          p = root / "kernel/printk/printk.c"
          s = p.read_text()
          for old, new in [
              ('strncpy(devkmsg_log_str, "on", 2)',
               'memcpy(devkmsg_log_str, "on", 2)'),
              ('strncpy(devkmsg_log_str, "off", 3)',
               'memcpy(devkmsg_log_str, "off", 3)'),
          ]:
              assert s.count(old) == 1, old
              s = s.replace(old, new)
          p.write_text(s)
          PY_PATCH

          git -C kernel/amlogic/linux-4.9-pie diff --check
          git -C kernel/amlogic/linux-4.9-pie diff --stat

      - name: Fix Amlogic CMA stats and trace buffer bounds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path

          root = Path("kernel/amlogic/linux-4.9-pie")

          # Correct zone statistic access in vmscan.
          p = root / "mm/vmscan.c"
          s = p.read_text()
          old = "node_page_state(pgdat, NR_CMA_ISOLATED)"
          new = "sum_zone_node_page_state(pgdat->node_id, NR_CMA_ISOLATED)"
          assert s.count(old) == 2
          p.write_text(s.replace(old, new))

          # Preserve clearing the rest of trace_iterator.
          p = root / "kernel/trace/trace.c"
          s = p.read_text()
          old = (
              "\t\tmemset(&iter.seq, 0,\n"
              "\t\t       sizeof(struct trace_iterator) -\n"
              "\t\t       offsetof(struct trace_iterator, seq));"
          )
          new = (
              "\t\tmemset((char *)&iter + "
              "offsetof(struct trace_iterator, seq), 0,\n"
              "\t\t       sizeof(iter) - "
              "offsetof(struct trace_iterator, seq));"
          )
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY_PATCH

          git -C kernel/amlogic/linux-4.9-pie diff --check
          git -C kernel/amlogic/linux-4.9-pie diff --stat

      - name: Step 4 - Install Ubuntu GCC 9 AArch64 Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=== APT update ==="
          updated=false
          for attempt in 1 2 3; do
            if sudo apt-get update               -o APT::Update::Error-Mode=any               -o Acquire::Retries=1               -o Acquire::http::Timeout=20; then
              updated=true
              break
            fi

            if [ "$attempt" -eq 1 ]; then
              for src in /etc/apt/sources.list                          /etc/apt/apt-mirrors.txt                          /etc/apt/sources.list.d/*.list                          /etc/apt/sources.list.d/*.sources; do
                [ -f "$src" ] || continue
                sudo sed -i                   's#azure.archive.ubuntu.com#archive.ubuntu.com#g'                   "$src"
              done
            fi
            sleep 5
          done
          [ "$updated" = true ] || exit 100

          echo "=== Install build dependencies ==="
          sudo apt-get install -y --no-install-recommends             bc bison flex libssl-dev libelf-dev make gcc g++             libc6-dev device-tree-compiler kmod cpio python3             file xz-utils ca-certificates             gcc-9-aarch64-linux-gnu binutils-aarch64-linux-gnu

          echo "=== Verify cross compiler ==="
          test -x /usr/bin/aarch64-linux-gnu-gcc-9
          /usr/bin/aarch64-linux-gnu-gcc-9 --version
          aarch64-linux-gnu-ld --version
          aarch64-linux-gnu-objcopy --version
          dpkg-query -W gcc-9-aarch64-linux-gnu             binutils-aarch64-linux-gnu

          echo "=== Configure Kbuild compiler prefix ==="
          mkdir -p "$RUNNER_TEMP/gt1-cross/bin"
          printf '%s\n'             '#!/bin/sh'             'exec /usr/bin/aarch64-linux-gnu-gcc-9 "$@"'             > "$RUNNER_TEMP/gt1-cross/bin/aarch64-linux-gnu-gcc"
          chmod 755             "$RUNNER_TEMP/gt1-cross/bin/aarch64-linux-gnu-gcc"
          echo "$RUNNER_TEMP/gt1-cross/bin" >> "$GITHUB_PATH"

      - name: Steps 5 to 14 - Run Full Kernel, Mali & QCA9377 Build & Verification Script
        run: |
          chmod +x build/scripts/linux_kernel_module_build.sh
          JOBS=2 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-Wno-attribute-alias" ./build/scripts/linux_kernel_module_build.sh

      - name: Upload Verified Kernel, Modules & Logs Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beelink-gt1-linux-4.9-arm64-output
          path: |
            out/linux-kernel-build/artifacts/Image.gz
            out/linux-kernel-build/artifacts/gt1_v30_2g.dtb
            out/linux-kernel-build/artifacts/mali.ko
            out/linux-kernel-build/artifacts/qca9377.ko
            out/linux-kernel-build/artifacts/Module.symvers
            out/linux-kernel-build/artifacts/kernel.config
            out/linux-kernel-build/artifacts/SHA256SUMS.txt
            out/linux-kernel-build/logs/*.log
          retention-days: 30
